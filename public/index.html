<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>需求看板</title>
    <link rel="stylesheet" href="/app.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>需求看板</h1>
          <p>只看未完成的需求</p>
        </div>
        <div class="top-status">
          <div class="connection" id="connection"></div>
          <p id="summary-hint"></p>
          <button class="status-button" id="show-settings">模型设置</button>
        </div>
      </header>

      <section class="workspace">
        <section class="inbox-panel">
          <div class="panel-heading">
            <div><h2>待处理 <span id="pending-count">0</span></h2></div>
            <button class="primary" id="show-add">＋ 手动添加</button>
          </div>
          <div class="list-head"><span>发送人</span><span>需求内容</span><span>图片</span><span>接收时间</span><span>操作</span></div>
          <div id="requirement-list" class="requirement-list"></div>
          <div class="completed-toggle"><button class="link-button" id="show-completed">查看已完成 <span id="completed-count">0</span></button></div>
          <div id="completed-list" class="completed-list hidden"></div>
        </section>

        <aside class="history-panel">
          <section class="watch-panel">
            <h2>监控私聊</h2>
            <p>群聊会自动发现；私聊请按姓名添加。仅保存他人发来的新消息。</p>
            <form id="watch-search-form" class="watch-search">
              <input id="watch-keyword" name="keyword" maxlength="30" placeholder="输入联系人姓名或关键词" aria-label="联系人姓名或关键词">
              <button class="secondary" type="submit">搜索</button>
            </form>
            <div id="watch-search-results" class="watch-results"></div>
            <div id="watch-users" class="watch-users"></div>
            <p id="watch-message" class="form-message"></p>
          </section>
          <div class="section-rule"></div>
          <h2>历史补录</h2>
          <p>选择时间范围，预览后决定哪些需求进入待处理列表。</p>
          <form id="history-form" class="history-form">
            <label>开始时间<input id="history-start" name="start" type="datetime-local" required></label>
            <label>结束时间<input id="history-end" name="end" type="datetime-local" required></label>
            <button class="primary full" type="submit">预览候选需求</button>
          </form>
          <section id="candidate-section" class="candidate-section hidden">
            <div class="candidate-title"><h3>候选需求 <span id="candidate-count">0</span></h3><label class="select-all"><input id="select-all" type="checkbox"> 全选</label></div>
            <div id="candidate-list"></div>
            <button class="secondary full" id="import-candidates">导入选中的需求</button>
          </section>
          <p id="history-message" class="form-message"></p>
        </aside>
      </section>
    </main>

    <dialog id="add-dialog">
      <form method="dialog" id="add-form">
        <div class="dialog-title"><h2>手动添加需求</h2><button class="icon-button" value="cancel" aria-label="关闭">×</button></div>
        <label>需求内容<input name="title" maxlength="60" required placeholder="例如：确认客户报价单"></label>
        <label>备注（可选）<textarea name="note" maxlength="300" placeholder="补充背景、截止时间等"></textarea></label>
        <div class="dialog-actions"><button value="cancel" class="secondary">取消</button><button class="primary" value="default">添加需求</button></div>
      </form>
    </dialog>
    <dialog id="settings-dialog">
      <form method="dialog" id="settings-form">
        <div class="dialog-title"><h2>模型设置</h2><button class="icon-button" value="cancel" aria-label="关闭">×</button></div>
        <p class="dialog-note">支持 DeepSeek 等 OpenAI 兼容接口。密钥仅保存到本机 .env 文件。</p>
        <label>接口地址<input name="baseUrl" type="url" required placeholder="https://api.deepseek.com/v1"></label>
        <label>模型名称<input name="model" required placeholder="deepseek-chat"></label>
        <label>API Key<input name="apiKey" type="password" autocomplete="new-password" placeholder="留空则保留当前密钥"></label>
        <p id="settings-message" class="form-message"></p>
        <div class="dialog-actions"><button class="secondary" id="test-model" type="button">测试连接</button><button value="cancel" class="secondary">取消</button><button class="primary" value="default">保存设置</button></div>
      </form>
    </dialog>
    <script type="module" src="/app.js"></script>
  </body>
</html>
